# Build budgets, checked by scripts/build-budget.py in the CI lint job.
# See AGENTS.md "Build health" for why they exist and how to change them.
#
# The check compares this tree with origin/main: the test binaries and each
# ratcheted crate may not grow. The numbers below are ceilings; a pull request
# does not edit them to keep a gain. Raising one needs an explicit edit here, a
# reason in the commit message, and the owner's review: it makes every build slower.

[test_binaries]
# Integration test targets (tests/*.rs, tests/*/main.rs, [[test]]) across the
# workspace. Each one is a separate executable linking the whole library. New
# tests go into an existing binary, so this only goes down.
max = 75

[lib_lines]
# Lines of .rs source in one crate's lib (src/ minus bin targets). No crate lib
# may grow past the target.
target = 40000

[lib_lines.ratchet]
# Crates above the target while they are being split. Each may only shrink.
# Raised from 105727 on 2026-11-15 by the owner's decision (2026-11-13),
# temporarily: the command-surface work needs new action kinds in this crate
# before the crate is split. It still only goes down from here, and the split
# brings it back under the old value.
aq-server = 107550

[lib_lines.allowance]
# Owner's decision, 2026-11-24: until this table is removed, a pull request may
# grow a crate's lib up to the number here instead of only up to main's count.
# The Code Health refactoring tickets extract helpers and add about 4,100 lines
# across fourteen open pull requests, and each was failing the ratchet above.
# Remove this table when those tickets have merged; the ratchet then holds main's
# count again. Agents never edit this file.
aq-server = 107550
