[package]
name = "aq-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Integration tests are a few domain binaries, each tests/<group>/main.rs with
# the former per-file binaries as modules: every test binary links the whole
# library, so new tests join an existing group (AGENTS.md "Build health").
autotests = false

[dependencies]
aq-human-http = { path = "../aq-human-http" }
aq-manual-sessions = { path = "../aq-manual-sessions" }
aq-profile-settings = { path = "../aq-profile-settings" }
hmac = "=0.12.1"
subtle = "=2.6.1"
http-body = "=1.1.0"
aq-central-authority = { path = "../aq-central-authority", version = "=0.1.0" }
aq-result-media = { path = "../aq-result-media", version = "=0.1.0" }
aq-command-registry = { path = "../aq-command-registry", version = "=0.1.0" }
aq-intelligence-config = { path = "../aq-intelligence-config", version = "=0.1.0" }
aq-profiled-state = { path = "../aq-profiled-state", version = "=0.1.0" }
aq-task-thread = { path = "../aq-task-thread", version = "=0.1.0" }
aq-stall-ladder = { path = "../aq-stall-ladder", version = "=0.1.0" }
aq-agent-grants = { path = "../aq-agent-grants", version = "=0.1.0" }
aq-dashboard-contract = { path = "../aq-dashboard-contract", version = "=0.1.0" }
aq-task-comments = { path = "../aq-task-comments", version = "=0.1.0" }
aq-human-cursor = { path = "../aq-human-cursor", version = "=0.1.0" }
aq-human-work = { path = "../aq-human-work", version = "=0.1.0" }
schemars = "1"
aq-review-protocol = { path = "../aq-review-protocol", version = "=0.1.0" }
aq-playbook-host = { path = "../aq-playbook-host", version = "=0.1.3" }
aq-observation-admission = { path = "../aq-observation-admission", version = "=0.1.0" }
aq-terminal-relay = { path = "../aq-terminal-relay", version = "=0.1.0" }
aq-terminal-relay-protocol = { path = "../aq-terminal-relay-protocol", version = "=0.1.0" }
aq-session-api = { path = "../aq-session-api", version = "=0.1.0" }
aq-observation-api = { path = "../aq-observation-api", version = "=0.1.0" }
chacha20poly1305 = "0.10.1"
zeroize = "1"
aq-accounting = { path = "../aq-accounting", version = "=0.1.0" }
aq-notifications = { path = "../aq-notifications", version = "=0.1.0" }
aq-lifecycle-api = { path = "../aq-lifecycle-api", version = "=0.1.0" }
aq-session-host.workspace = true
aq-wait-engine = { path = "../aq-wait-engine", version = "=0.1.0" }
# Frozen installed endpoints retain 0.1.11; B2 can use the delegated contract.
aq-admission = { path = "../aq-admission", version = "=0.1.12" }
aq-admission-sandbox = { package = "aq-admission", path = "../../vendor/aq-admission-0.3.3", version = "=0.3.3" }
aq-phase-terminal-protocol = { path = "../aq-phase-terminal-protocol", version = "=0.1.2" }
aq-agent-api = { path = "../aq-agent-api", version = "=0.1.0" }
aq-session-protocol = { path = "../../vendor/aq-session-protocol-0.1.0", version = "=0.1.0" }
aq-row-retention = { path = "../aq-row-retention" }
aq-machine-control = { path = "../aq-machine-control" }
aq-context-renewal = { path = "../aq-context-renewal" }
aq-playbook-domain = { path = "../aq-playbook-domain" }
aq-provider-quota = { path = "../aq-provider-quota" }
aq-environment-templates = { path = "../aq-environment-templates" }
aq-selection = { path = "../aq-selection", version = "=0.1.5" }
aq-swarm = { path = "../aq-swarm", version = "=0.1.0" }
aq-history-caps = { path = "../aq-history-caps", version = "=0.1.0" }
aq-profiles = { path = "../aq-profiles", version = "=0.1.2" }
aq-protocol.workspace = true
aq-worker-protocol.workspace = true
aq-release.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
nix.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
unicode-normalization = "=0.1.26"

[features]
test-support = ["aq-notifications/test-support"]
# Instrumented disposable recovery fixture only; absent from release builds.
recovery-test-support = ["test-support"]

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
tokio = { workspace = true, features = ["test-util"] }
nix = { workspace = true, features = ["signal", "process"] }
aq-playbooks-compiler = { path = "../../vendor/aq-playbooks-0173673/crates/aq-playbooks-compiler", version = "=0.1.0" }
aq-server = { path = ".", features = ["test-support"] }
http-body-util.workspace = true
rsa.workspace = true
tempfile.workspace = true
tower.workspace = true

[[test]]
name = "it_profiled"
path = "tests/it_profiled/main.rs"

[[test]]
name = "it_native"
path = "tests/it_native/main.rs"

[[test]]
name = "it_phase"
path = "tests/it_phase/main.rs"

[[test]]
name = "it_schema"
path = "tests/it_schema/main.rs"

[[test]]
name = "it_playbook"
path = "tests/it_playbook/main.rs"

[[test]]
name = "it_dashboard"
path = "tests/it_dashboard/main.rs"

[[test]]
name = "it_access"
path = "tests/it_access/main.rs"

[[test]]
name = "it_server"
path = "tests/it_server/main.rs"
