[package]
name = "aq-environments"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Spec 0017: environment versions in the database and the one catalog every reader of environment definitions and templates goes through"

[features]
# Spec 0017: the whole crate, off by default (aq-server's `project_environments`).
project_environments = ["dep:aq-project-policy", "dep:aq-role-settings", "dep:aq-protocol", "dep:aq-selection", "dep:axum"]
# With spec 0016's `/v1/git` route: the builder's fetch-only job grant.
# And `aq environment try`'s checkpoint, `refs/heads/aq-try/<attempt>`.
delivery_playbook = ["project_environments", "dep:aq-delivery", "aq-delivery/delivery_playbook", "aq-delivery/environment_try"]

[dependencies]
aq-admission = { path = "../aq-admission", version = "=0.1.13" }
aq-delivery = { path = "../aq-delivery", optional = true }
aq-environment-templates = { path = "../aq-environment-templates" }
aq-project-policy = { path = "../aq-project-policy", optional = true, features = ["project_environments"] }
aq-protocol = { workspace = true, optional = true }
aq-selection = { path = "../aq-selection", optional = true, features = ["project_environments"] }
aq-role-settings = { path = "../aq-role-settings", optional = true, features = ["project_environments"] }
axum = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
tracing.workspace = true
uuid.workspace = true
