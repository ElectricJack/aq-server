[package]
name = "aq-project-policy"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Pure project policy and admission snapshots (project bindings, ceilings, eligibility)"

[features]
# Spec 0017 (sandbox environments per project and per task), off by default.
project_environments = ["aq-profiles/project_environments", "aq-selection/project_environments"]

[dependencies]
aq-delivery = { path = "../aq-delivery" }
aq-profiles = { path = "../aq-profiles", version = "=0.1.2" }
aq-selection = { path = "../aq-selection", version = "=0.1.5" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
schemars = { version = "1", features = ["uuid1"] }
