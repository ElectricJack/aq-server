[package]
name = "aq-delivery"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Central delivery primitives over the aq-git socket: candidates, publication policy and reconciliation"

[dependencies]
async-trait.workspace = true
aq-role-settings = { path = "../aq-role-settings", optional = true }
aq-worker-protocol.workspace = true
chrono.workspace = true
hex.workspace = true
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }
unicode-normalization = "=0.1.26"
uuid.workspace = true

[features]
# Epic 0 (spec 0016): unfinished delivery-by-playbook code, off by default.
delivery_playbook = [
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:aq-role-settings",
    "aq-role-settings/delivery_playbook",
    "dep:tracing",
]

[dev-dependencies]
axum.workspace = true
rand.workspace = true
rsa.workspace = true
tempfile.workspace = true
