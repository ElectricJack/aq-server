[package]
name = "aq-delivery"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Central delivery primitives over the aq-git socket: candidates, publication policy and reconciliation"

[dependencies]
async-trait.workspace = true
aq-admission = { path = "../aq-admission", version = "=0.1.13", optional = true }
aq-dashboard-contract = { path = "../aq-dashboard-contract", version = "=0.1.0" }
aq-role-settings = { path = "../aq-role-settings", optional = true }
aq-worker-protocol.workspace = true
base64.workspace = true
bytes = { version = "1", optional = true }
chrono.workspace = true
hex.workspace = true
http = { version = "1", optional = true }
http-body = { version = "=1.1.0", optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { version = "1", features = ["client", "http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
jsonwebtoken = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }
unicode-normalization = "=0.1.26"
uuid.workspace = true

[features]
# Epic 0 (spec 0016): unfinished delivery-by-playbook code, off by default.
delivery_playbook = [
    "dep:jsonwebtoken",
    "dep:aq-role-settings",
    "aq-role-settings/delivery_playbook",
    "dep:tracing",
    "dep:aq-admission",
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
]
# Spec 0017 §6.2 (aq-environments' `delivery_playbook`): an attempt may also
# force-push its own `refs/heads/aq-try/<attempt>`, the `aq environment try`
# checkpoint, which delivery never publishes.
environment_try = ["delivery_playbook"]
# With `delivery_playbook`: a fake aq-git git-HTTP socket backed by
# `git http-backend`, for tests of the server that depends on this crate.
test-support = []

[dev-dependencies]
axum.workspace = true
rand.workspace = true
rsa.workspace = true
tempfile.workspace = true
