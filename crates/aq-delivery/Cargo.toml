[package]
name = "aq-delivery"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Central delivery primitives over the aq-git socket: candidates, publication policy and reconciliation"

[dependencies]
async-trait.workspace = true
aq-admission = { path = "../aq-admission", version = "=0.1.13" }
aq-dashboard-contract = { path = "../aq-dashboard-contract", version = "=0.1.0" }
aq-role-settings = { path = "../aq-role-settings" }
aq-worker-protocol.workspace = true
base64.workspace = true
bytes = "1"
chrono.workspace = true
hex.workspace = true
http = "1"
http-body = "=1.1.0"
http-body-util.workspace = true
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken.workspace = true
nix.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization = "=0.1.26"
uuid.workspace = true

[features]
# Gates the `source_checks::observation` readers (aq-server enables it).
source_observation = []
# Spec 0017 §6.2 (enabled by aq-environments' `project_environments`): an
# attempt may also force-push its own `refs/heads/aq-try/<attempt>`, the
# `aq environment try` checkpoint, which delivery never publishes.
environment_try = []
# A fake aq-git git-HTTP socket backed by
# `git http-backend`, for tests of the server that depends on this crate.
test-support = ["nix/signal"]

[dev-dependencies]
axum.workspace = true
nix = { workspace = true, features = ["signal"] }
rand.workspace = true
rsa.workspace = true
tempfile.workspace = true
