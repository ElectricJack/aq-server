[package]
name = "aq-playbook-domain"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Playbook fixed host contracts, typed grant scope and the HTTP error mapping"

[features]
# Epic 0 (spec 0016): host catalog 2.3.0 (profile 10), off by default.
delivery_playbook = ["dep:aq-machine-control", "dep:async-trait", "aq-playbook-host/delivery_playbook"]

[dependencies]
async-trait = { workspace = true, optional = true }
aq-machine-control = { path = "../aq-machine-control", version = "=0.1.0", optional = true }
aq-routing = { path = "../aq-routing" }
aq-playbook-host = { path = "../aq-playbook-host", version = "=0.1.3" }
aq-playbooks-compiler = { path = "../../vendor/aq-playbooks-1196671/crates/aq-playbooks-compiler", version = "=0.2.0" }
aq-session-protocol = { path = "../../vendor/aq-session-protocol-0.1.0", version = "=0.1.0" }
axum.workspace = true
hex.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
