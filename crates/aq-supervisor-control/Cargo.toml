[package]
name = "aq-supervisor-control"
version.workspace = true
edition.workspace = true
publish.workspace = true
[features]
# Supervisors get full access (owner scope and registry); off by default.
supervisor_full_access = ["dep:tower"]
# Read-only code access through aq-git (`/v1/supervisor/git`), mounted only
# together with supervisor_full_access.
delivery_playbook = ["dep:aq-delivery", "aq-delivery/delivery_playbook"]

[dependencies]
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }
uuid.workspace = true
aq-manual-sessions = { path = "../aq-manual-sessions" }
aq-central-authority = { path = "../aq-central-authority" }
aq-delivery = { path = "../aq-delivery", optional = true }
async-trait.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
