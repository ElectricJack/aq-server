[package]
name = "aq-supervisor-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
reqwest.workspace = true
aq-supervisor-control = { path = "../aq-supervisor-control" }
aq-swarm-settings = { path = "../aq-swarm-settings" }
aq-internal-work = { path = "../aq-internal-work" }
aq-intelligence-config = { path = "../aq-intelligence-config" }
aq-command-registry = { path = "../aq-command-registry" }
aq-central-authority = { path = "../aq-central-authority" }
aq-server = { path = "../aq-server" }
aq-session-host.workspace = true
aq-codex-mapper.workspace = true
aq-responses-transport.workspace = true
aq-session-protocol = { path = "../../vendor/aq-session-protocol-0.1.0", version = "=0.1.0" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
tokio.workspace = true
uuid.workspace = true
libc = "0.2"
zeroize = "1"
sha2.workspace = true
chrono.workspace = true

[features]
# A non-root test identity for the native runs (no uid drop, no chown).
# Enabled only by this crate's own dev-dependency below.
test-support = []
delivery_playbook = ["aq-server/delivery_playbook"]
supervisor_full_access = ["aq-server/supervisor_full_access"]
project_environments = ["aq-server/project_environments"]

[dev-dependencies]
aq-supervisor-host = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
aq-server = { path = "../aq-server", features = ["test-support"] }
aq-agent-api = { path = "../aq-agent-api", version = "=0.1.0" }
axum.workspace = true
chrono.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
toml.workspace = true
tower.workspace = true

[[bin]]
name = "aq-session-host"
path = "src/helper.rs"
