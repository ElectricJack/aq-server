[package]
name = "aq-profiles"
version = "0.1.2"
edition = "2024"
publish = false

[[bin]]
name = "aq-profile"
path = "src/main.rs"

[features]
# Spec 0017: the execution profile's `environment` is optional. Off by default.
project_environments = []

[dependencies]
aq-agent-grants = { path = "../aq-agent-grants", version = "=0.1.0" }
aq-agent-api = { path = "../aq-agent-api", version = "=0.1.0" }
aq-session-protocol = { path = "../../vendor/aq-session-protocol-0.1.0", version = "=0.1.0" }
aq-session-api = { path = "../aq-session-api", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
