name: ci

on:
  pull_request:
  # The merge queue's group commits must report every required check.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds are one-shot: incremental state only costs time and cache space.
  # Interactive builds keep Cargo.toml's incremental dev profile.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # build-budget.py compares this tree with origin/main.
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build budgets (test binaries and lib size ratchets)
        run: python3 scripts/build-budget.py
      - name: Verify migration numbering and parallel additions
        run: |
          python3 scripts/migration_catalog.py
          python3 scripts/test-migration-catalog.py
          python3 scripts/test-renumber-migrations.py
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: Verify the pinned standalone worker and public contracts
        run: python3 scripts/check-worker-candidate.py --official
      - name: Verify the pinned independent session contract
        run: python3 scripts/check-session-contract.py
      - name: Verify pinned aq-git sources and Docker build stages
        run: python3 scripts/check-git-candidate.py --official
      - name: Verify the pinned dashboard release and server image wiring
        run: |
          python3 scripts/check-dashboard-candidate.py
          python3 scripts/test-dashboard-candidate.py
      - name: Verify the pinned playbook source closure
        run: python3 scripts/check-playbook-source.py
      - name: Verify the pinned independent lifecycle contract
        run: python3 scripts/check-lifecycle-contract.py
      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo clippy (aq-updater with test-verifier)
        run: cargo clippy -p aq-updater --all-targets --locked --features test-verifier -- -D warnings
      # The feature only changes src/execution.rs, src/execution/api.rs,
      # src/store.rs and tests/it_server/execution.rs; lint the lib and the
      # it_server test binary (execution and readiness, which the test job runs
      # with the feature), not every test binary again.
      - name: cargo clippy (recovery fixture)
        run: cargo clippy -p aq-server --locked --features recovery-test-support --lib --test it_server -- -D warnings

  agent-contract:
    name: scoped agent contract conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned developer dependencies and check contract
        run: |
          python3 -m venv "$RUNNER_TEMP/agent-contract-venv"
          "$RUNNER_TEMP/agent-contract-venv/bin/pip" install -r protocol/agent-access/v1/requirements-dev.txt
          "$RUNNER_TEMP/agent-contract-venv/bin/python" protocol/agent-access/v1/generate.py --check
          "$RUNNER_TEMP/agent-contract-venv/bin/python" -m unittest discover -s protocol/agent-access/v1 -p test_conformance.py -v

  # The `tests` check is split across runners (AGENTS.md "CI wall time"):
  #   tests-build  compiles every test binary once into a nextest archive
  #   tests-shard  runs 1/N of the archive's tests per runner (nextest
  #                --partition hash:i/N), each with its own PostgreSQL
  #   tests-extra  the two feature-on runs, which need their own build
  #   tests-doc    doctests (nextest does not run them)
  #   tests        the single aggregate check: fails unless every job above
  #                succeeded. This is the name to read (and to require).
  tests-build:
    name: tests (build archive)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.148
      # The server's manifest tests pass --source-revision r, which a binary
      # stamped with AQ_SOURCE_REVISION refuses. Tests build unstamped.
      - name: Check the build is unstamped
        run: |
          if [ -n "${AQ_SOURCE_REVISION:-}" ]; then
            echo "::error::AQ_SOURCE_REVISION is set; cargo test must build unstamped"
            exit 1
          fi
      - name: cargo nextest archive --workspace
        run: |
          cargo nextest archive --workspace --locked --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
          install -m 0755 "$(command -v cargo-nextest)" "$RUNNER_TEMP/cargo-nextest"
      # The archive's total, to compare with the sum of the shards' counts.
      - name: Count the archived tests
        run: |
          count=$(cargo nextest list --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap . --message-format oneline | wc -l)
          echo "tests in the archive: $count"
          echo "Tests in the archive: $count" >> "$GITHUB_STEP_SUMMARY"
      # The archive is already zstd-compressed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: |
            ${{ runner.temp }}/nextest-archive.tar.zst
            ${{ runner.temp }}/cargo-nextest
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  tests-shard:
    name: tests (shard ${{ matrix.shard }}/6)
    needs: tests-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The shard count and the partition denominator below must agree.
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      # The archive holds the compiled test binaries only; the checkout
      # supplies the sources tests read at run time, .config/nextest.toml
      # (profiles, test groups) and Cargo.lock/manifests.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/archive
      # Same selection, profile and groups as the unsharded run; hash
      # partitioning gives every test to exactly one shard.
      # Extracting into the checkout puts every binary at the absolute path the
      # build job compiled into `env!("CARGO_BIN_EXE_*")` (same runner layout);
      # a temporary directory left those paths missing.
      - name: cargo nextest run (shard ${{ matrix.shard }}/6)
        run: |
          # env!("CARGO_TARGET_TMPDIR") points here; the archive does not carry it.
          mkdir -p "$GITHUB_WORKSPACE/target/tmp"
          # Artifact downloads do not preserve executable permissions.
          chmod +x "$RUNNER_TEMP/archive/cargo-nextest"
          "$RUNNER_TEMP/archive/cargo-nextest" nextest run --archive-file "$RUNNER_TEMP/archive/nextest-archive.tar.zst" \
            --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
            --workspace-remap . --no-fail-fast --profile ci \
            --partition hash:${{ matrix.shard }}/6

  # The feature-on runs rebuild aq-updater and aq-server with different
  # features, so they cannot use the archive. They run beside the build job.
  tests-extra:
    name: tests (feature-on runs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.148
      - name: Check the build is unstamped
        run: |
          if [ -n "${AQ_SOURCE_REVISION:-}" ]; then
            echo "::error::AQ_SOURCE_REVISION is set; cargo test must build unstamped"
            exit 1
          fi
      - name: cargo nextest run -p aq-updater --features test-verifier
        run: cargo nextest run -p aq-updater --locked --no-fail-fast --profile ci --features test-verifier
      # One aq-server build with the sandbox environments flag (spec 0017).
      - name: Delivery document activation, result decisions, PR operations and environments
<<<<<<< HEAD
