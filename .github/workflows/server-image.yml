name: server-image

# Builds the server image the live aq-ms1 stack runs on every merge to main
# and publishes it to GHCR by digest as ghcr.io/electricjack/aq-server:sha-<sha>.
# `:main` moves to it only while that commit is still main's head, so an older
# build that finishes late never replaces a newer one. On the host,
# scripts/ms1-deploy.py follows `:main` (docs/operations/ms1-automated-deploy.md).
# Tagged, signed releases for the updater stay in release.yml.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/ms1-deploy.py
      - scripts/test-ms1-deploy.py
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/electricjack/aq-server
  # The compile-time epic flags aq-ms1 runs with. Drop one here when its epic
  # is confirmed and the flag is removed (docs/operations/epic-feature-retirement.md).
  CARGO_FEATURES: project_environments,supervisor_full_access
  AQ_DELIVERY_PLAYBOOK: 'true'
  # The profile aq-ms1's images have always used (AGENTS.md "Docker images");
  # release.yml builds `release`.
  CARGO_PROFILE: ci-image

jobs:
  deploy-script:
    name: ms1-deploy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run the deploy script's tests
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/pytest" pytest
          PYTHONPATH="$RUNNER_TEMP/pytest" python3 -m pytest -q scripts/test-ms1-deploy.py

  image:
    name: build and publish
    if: github.event_name != 'pull_request'
    needs: deploy-script
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The same label sources as release.yml.
      - name: Read the version, state format and worker protocol
        id: meta
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          state_format=$(python3 scripts/migration_catalog.py)
          protocol_source=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["dependencies"]["aq-protocol"]["path"] + "/src/lib.rs")')
          protocol_max=$(sed -n 's/^pub const SUPPORTED_WORKER_PROTOCOLS: (u32, u32) = ([0-9][0-9]*, \([0-9][0-9]*\));$/\1/p' "$protocol_source")
          if [[ ! "$state_format" =~ ^[0-9]+$ || ! "$protocol_max" =~ ^[0-9]+$ ]]; then
            echo "::error::cannot read the state format ('$state_format') or protocol ('$protocol_max')"
            exit 1
          fi
          python3 scripts/check-git-candidate.py --official
          {
            echo "version=$version"
            echo "state_format=$state_format"
            echo "protocol_max=$protocol_max"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: server
          push: true
          provenance: false
          sbom: false
          build-args: |
            AQ_SOURCE_REVISION=${{ github.sha }}
            AQ_VERSION=${{ steps.meta.outputs.version }}
            AQ_STATE_FORMAT=${{ steps.meta.outputs.state_format }}
            AQ_PROTOCOL_MAX=${{ steps.meta.outputs.protocol_max }}
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
            CARGO_FEATURES=${{ env.CARGO_FEATURES }}
            AQ_DELIVERY_PLAYBOOK=${{ env.AQ_DELIVERY_PLAYBOOK }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Check the pushed labels and move :main if this is still main's head
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.server.outputs.digest }}
          STATE_FORMAT: ${{ steps.meta.outputs.state_format }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected image digest '$DIGEST'"
            exit 1
          fi
          image=$IMAGE@$DIGEST
          docker pull --quiet "$image" >/dev/null
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          state=$(docker image inspect --format '{{index .Config.Labels "io.agent-q.state-format"}}' "$image")
          if [ "$revision" != "$GITHUB_SHA" ] || [ "$state" != "$STATE_FORMAT" ]; then
            echo "::error::$image is labelled revision=$revision state-format=$state"
            exit 1
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --prefer-index=false -t "$IMAGE:main" "$image"
          else
            echo "main is at $head, not $GITHUB_SHA: :main is left alone"
          fi
          {
            echo "### aq-server $GITHUB_SHA"
            echo '```'
            echo "$image"
            echo "state format $state"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
