# Agent Q vault configuration (production example; set your origin and Access application).

# Schema version of this file. This server reads only version 1.
format_version = 1

# "development" or "production". Production forbids dev auth and requires https.
environment = "production"

[server]
# Address of the human-facing admin listener.
admin_bind = "0.0.0.0:8080"
# Address of the worker-facing listener.
worker_bind = "0.0.0.0:8081"
# Externally visible origin of the admin UI; must be https:// in production.
public_origin = "https://aq.example.com"

[auth]
# "dev" (development only) or "cloudflare_access".
mode = "cloudflare_access"
# Cloudflare Access team URL and application audience.
team_domain = "https://example.cloudflareaccess.com"
audience = "replace-with-your-access-application-audience"

[bootstrap]
# Email that becomes the first owner when bootstrap is enabled.
owner_email = "owner@example.com"
# Whether the first owner may be created automatically on first sign-in.
enabled = true

[enrollment]
# Lifetime of a worker enrollment code, in seconds (default 600).
code_ttl_secs = 600

[workers]
# How often workers send heartbeats, in seconds (default 15).
heartbeat_interval_secs = 15
# A worker is shown offline after this many seconds without a heartbeat (default 60); must exceed the heartbeat interval.
offline_after_secs = 60

# Optional production PNG evidence store. Enable only after mounting a persistent
# private volume at this absolute path (owned by the server UID, mode 0700).
# Generate storage_id once per installation and retain it with the volume and DB;
# replacing it on restart prevents the retained owner from reopening its store.
# [result_media]
# root = "/var/lib/aq/result-media"
# storage_id = "<stable-installation-UUID>"
# uploads_enabled = true

# Match AQ_GRAPH_WORKSPACE and AQ_GRAPH_ACTOR in the operator environment.
[agent_access]
graph_url = "http://aq-graph:8741"
graph_token_file = "/run/aq/graph_token"
mutation_actor_id = "aq-server"
[source_retention]
keep_per_task = 2
max_age = 2592000 # seconds (30 days)
staging_root = "/var/lib/aq/source-staging"
git_root = "/var/lib/aq/git"
git_socket = "/run/aq-git/central.sock"
[updates]
spool_dir = "/updater"

# Intelligence registry (optional; shown for the docker-local Claude and Codex
# executors). Keep it commented until the values below are your installation's.
#
# How a node's harness qualification is matched, for one harness:
#  1. The worker reports its installed harnesses as exact qualification
#     artifact references (id, version, digest) in its inventory request.
#  2. The server finds the entry below whose `qualification` equals the
#     reference exactly (`intelligence/inventory.rs`), and stores that entry,
#     not the worker's description of it, in the node's capability snapshot. An
#     unlisted reference is refused ("unrecognized qualified harness").
#  3. Selection compares the entry's `harness` name with the route's and the
#     execution profile's harnesses, and its `adapter` and `environment` with
#     the prepared launch. `capabilities` must list what the execution
#     profile requires, and a container-confined harness must list
#     `aq.harness.container-confinement`.
#  4. Admission and renewal re-check the exact `harness`, `cli_version`,
#     `adapter`, `environment` and `qualification` against this list again.
# So one `[[intelligence.qualified_harnesses]]` entry per harness: the Codex
# one sits next to the Claude one. They differ in `harness`, `cli_version`,
# `adapter.id` and `qualification`. The worker prints the exact references
# (`aq-worker ms1-definitions`); the digests below are placeholders. Changing
# this list needs a higher `revision` and a restart.
#
# [intelligence]
# revision = 2
#
# [[intelligence.qualified_harnesses]]
# harness = "claude"
# cli_version = "2.1.318"
# capabilities = [
#   { id = "aq.harness.startup-context", version = 1 },
#   { id = "aq.harness.stop", version = 1 },
#   { id = "aq.harness.container-confinement", version = 1 },
# ]
# adapter = { id = "aq.claude-result-local-adapter", version = "1", digest = "<sha256 of the adapter definition>" }
# environment = { id = "<environment id>", version = "1", digest = "<sha256 of the environment definition>" }
# qualification = { id = "<claude qualification id>", version = "1", digest = "<sha256 of the qualification>" }
# [intelligence.qualified_harnesses.limits]
# context_bytes = 8192
# max_output_tokens = 128
# wall_time_ms = 60000
# memory_bytes = 268435456
# cpu_millis = 60000
# process_limit = 8
#
# [[intelligence.qualified_harnesses]]
# harness = "codex"
# cli_version = "0.166.0"
# capabilities = [
#   { id = "aq.harness.startup-context", version = 1 },
#   { id = "aq.harness.stop", version = 1 },
#   { id = "aq.harness.container-confinement", version = 1 },
# ]
# adapter = { id = "aq.codex-docker-result-local-adapter", version = "1", digest = "<sha256 of the adapter definition>" }
# environment = { id = "<environment id>", version = "1", digest = "<sha256 of the environment definition>" }
# qualification = { id = "<codex qualification id>", version = "1", digest = "<sha256 of the qualification>" }
# [intelligence.qualified_harnesses.limits]
# context_bytes = 8192
# max_output_tokens = 128
# wall_time_ms = 60000
# memory_bytes = 268435456
# cpu_millis = 60000
# process_limit = 8
#
# The ChatGPT login `owner-codex-subscription` is a `[[intelligence.credentials]]`
# entry like the Claude one in docs/implementation/MS1-evidence/intelligence.toml:
# kind = "subscription-login", provider = "openai", delivery_mode =
# "server_material_v1", and docker-local among its allowed backends.
